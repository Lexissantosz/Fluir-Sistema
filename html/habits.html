<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Hábitos · Fluir MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/mvp.css"></head>
<body data-page="habits">
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>
    <main class="main">
      <header class="topbar">
        <div><span class="eyebrow">Constância sem punição</span><h1>Hábitos</h1></div>
        <div class="top-actions">
          <button class="icon-btn" type="button" data-theme-toggle aria-label="Alternar tema">◐</button>
          <button class="avatar" type="button" data-nav="settings.html" title="Configurações">AS</button>
        </div>
      </header>
      
  <section class="stats">
    <article><span>Hoje</span><strong data-habit-stat>0/0</strong><small>hábitos concluídos</small></article>
    <article><span>Sequência</span><strong data-habit-streak>0 dias</strong><small>maior sequência atual</small></article>
    <article><span>Consistência</span><strong data-habit-consistency>0%</strong><small>progresso de hoje</small></article>
  </section>

  <section class="grid habit-layout">
    <article class="card">
      <div class="card-head"><div><span class="eyebrow">Hoje</span><h3>Seu ritmo</h3></div></div>
      <div class="habit-list" data-habit-list></div>
    </article>

    <aside class="card form-card">
      <span class="eyebrow">Adicionar</span><h3>Novo hábito</h3>
      <form data-new-habit-form>
        <label>Nome<input name="name" required placeholder="Ex.: estudar inglês"></label>
        <label>Meta simples<input name="target" placeholder="Ex.: 20 min"></label>
        <button class="button primary full" type="submit">Salvar hábito</button>
      </form>
    </aside>
  </section>

    </main>
  </div>
  <nav class="bottom-nav" data-bottom-nav></nav>
  <div class="toast" data-toast></div>
  <script src="../js/mvp.js"></script>
</body>
</html>
