<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Hábitos · Fluir Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/mockup.css">
</head>
<body class="mockup-app" data-page="habits">
  <div class="demo-ribbon">Mockup visual · dados demonstrativos</div>
  <div class="app-layout">
    <aside class="app-sidebar" data-shell-nav></aside>
    <main class="app-main">
      <header class="page-header">
        <div>
          <span class="eyebrow">Constância sem culpa</span>
          <h1>Hábitos</h1>
        </div>
        <div class="header-actions">
          <button class="icon-button" type="button" data-theme-toggle aria-label="Alternar tema">◐</button>
          <div class="avatar" title="Alex">AS</div>
        </div>
      </header>
      
  <section class="metric-grid three">
    <article class="metric-card"><span>Sequência</span><strong>8 dias</strong><small>melhor marca do mês</small></article>
    <article class="metric-card"><span>Hoje</span><strong>4/6</strong><small>hábitos concluídos</small></article>
    <article class="metric-card"><span>Consistência</span><strong>76%</strong><small>últimos 30 dias</small></article>
  </section>
  <section class="panel">
    <div class="panel-heading"><div><span class="eyebrow">Quinta-feira</span><h3>Seu ritmo de hoje</h3></div><button class="button ghost compact">+ Hábito</button></div>
    <div class="habit-list">
      <label class="habit-row"><input type="checkbox" checked><span><strong>Beber água ao acordar</strong><small>Saúde · diário</small></span><b>8 dias</b></label>
      <label class="habit-row"><input type="checkbox" checked><span><strong>Estudar inglês</strong><small>Estudos · 20 min</small></span><b>5 dias</b></label>
      <label class="habit-row"><input type="checkbox" checked><span><strong>Organizar espaço de trabalho</strong><small>Casa · rápido</small></span><b>3 dias</b></label>
      <label class="habit-row"><input type="checkbox" checked><span><strong>Tomar medicamentos</strong><small>Autocuidado · rotina</small></span><b>12 dias</b></label>
      <label class="habit-row"><input type="checkbox"><span><strong>Ler algumas páginas</strong><small>Pessoal · sem meta rígida</small></span><b>2 dias</b></label>
      <label class="habit-row"><input type="checkbox"><span><strong>Preparar o dia seguinte</strong><small>Rotina · noite</small></span><b>6 dias</b></label>
    </div>
  </section>

    </main>
  </div>
  <nav class="mobile-nav" data-mobile-nav aria-label="Navegação mobile"></nav>
  <script src="../js/mockup.js"></script>
</body>
</html>
