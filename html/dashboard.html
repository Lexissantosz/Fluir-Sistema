<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Meu dia · Fluir MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/mvp.css"></head>
<body data-page="dashboard">
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>
    <main class="main">
      <header class="topbar">
        <div><span class="eyebrow">Visão geral</span><h1>Meu dia</h1></div>
        <div class="top-actions">
          <button class="icon-btn" type="button" data-theme-toggle aria-label="Alternar tema">◐</button>
          <button class="avatar" type="button" data-nav="settings.html" title="Configurações">AS</button>
        </div>
      </header>
      
  <section class="welcome">
    <div><span class="eyebrow">Hoje</span><h2>Bom dia, <span data-user-name>Alex</span>.</h2><p>Seu dia não precisa estar perfeito para estar andando.</p></div>
    <div class="day-score"><strong data-score>0%</strong><small>progresso do dia</small></div>
  </section>

  <section class="stats">
    <article><span>Tarefas</span><strong data-stat-tasks>0/0</strong><small>concluídas hoje</small></article>
    <article><span>Hábitos</span><strong data-stat-habits>0/0</strong><small>marcados hoje</small></article>
    <article><span>Água</span><strong data-stat-water>0 ml</strong><small data-stat-water-goal>de 2000 ml</small></article>
  </section>

  <section class="grid two">
    <article class="card">
      <div class="card-head"><div><span class="eyebrow">Prioridades</span><h3>Tarefas de hoje</h3></div><a href="tasks.html">Abrir</a></div>
      <div class="simple-list" data-dashboard-tasks></div>
    </article>

    <article class="card">
      <div class="card-head"><div><span class="eyebrow">Rotina</span><h3>Hábitos de hoje</h3></div><a href="habits.html">Abrir</a></div>
      <div class="simple-list" data-dashboard-habits></div>
    </article>
  </section>

    </main>
  </div>
  <nav class="bottom-nav" data-bottom-nav></nav>
  <div class="toast" data-toast></div>
  <script src="../js/mvp.js"></script>
</body>
</html>
