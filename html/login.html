<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Entrar · Fluir Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/mockup.css">
</head>
<body class="auth-page" data-page="login">
  <div class="auth-brand">
    <a class="wordmark" href="../index.html"><span class="brand-symbol">F</span><strong>Fluir</strong></a>
    <span class="prototype-tag">Mockup</span>
  </div>

  <main class="auth-layout">
    <section class="auth-copy">
      <span class="eyebrow">Bem-vindo de volta</span>
      <h1>Organize o que importa sem perder o seu ritmo.</h1>
      <p>Uma experiência para enxergar o dia com clareza, cuidar da rotina e registrar o que faz diferença.</p>
      <div class="quote-card">
        <span>“</span>
        <p>Organização não precisa significar controle de cada minuto.</p>
      </div>
    </section>

    <section class="auth-card">
      <div class="auth-tabs">
        <button class="active" type="button" data-auth-tab="login">Entrar</button>
        <button type="button" data-auth-tab="register">Criar conta</button>
      </div>

      <form data-auth-panel="login">
        <label>E-mail<input type="email" value="alex@fluir.app" aria-label="E-mail"></label>
        <label>Senha<input type="password" value="123456" aria-label="Senha"></label>
        <button class="button primary full" type="button" data-nav="dashboard.html">Entrar</button>
        <small>Dados preenchidos apenas para demonstrar o fluxo.</small>
      </form>

      <form class="hidden" data-auth-panel="register">
        <label>Nome<input type="text" value="Alex Santos"></label>
        <label>E-mail<input type="email" value="alex@fluir.app"></label>
        <label>Senha<input type="password" value="123456"></label>
        <button class="button primary full" type="button" data-nav="setup.html">Criar conta e configurar</button>
      </form>
    </section>
  </main>
  <script src="../js/mockup.js"></script>
</body>
</html>
