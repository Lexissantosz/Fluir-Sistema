<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Entrar · Fluir MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/mvp.css"></head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-intro">
      <a class="brand" href="../index.html"><span>F</span><strong>Fluir</strong></a>
      <div>
        <span class="eyebrow">MVP funcional</span>
        <h1>Menos controle. Mais clareza.</h1>
        <p>Entre para continuar seu dia ou crie uma conta local de demonstração.</p>
      </div>
    </section>

    <section class="auth-card">
      <div class="tabs">
        <button class="active" data-auth-tab="login">Entrar</button>
        <button data-auth-tab="register">Criar conta</button>
      </div>

      <form data-auth-panel="login" data-login-form>
        <label>E-mail<input type="email" name="email" value="alex@fluir.app" required></label>
        <label>Senha<input type="password" name="password" value="123456" required></label>
        <button class="button primary full" type="submit">Entrar</button>
        <p class="form-help">Na primeira execução, use qualquer e-mail e senha com pelo menos 6 caracteres.</p>
      </form>

      <form class="hidden" data-auth-panel="register" data-register-form>
        <label>Nome<input type="text" name="name" value="Alex" required></label>
        <label>E-mail<input type="email" name="email" value="alex@fluir.app" required></label>
        <label>Senha<input type="password" name="password" value="123456" minlength="6" required></label>
        <button class="button primary full" type="submit">Criar conta</button>
      </form>

      <div class="form-message" data-auth-message></div>
    </section>
  </main>
  <script src="../js/mvp.js"></script>
</body>
</html>
