<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Configurações · Fluir MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/mvp.css"></head>
<body data-page="settings">
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>
    <main class="main">
      <header class="topbar">
        <div><span class="eyebrow">Preferências do MVP</span><h1>Configurações</h1></div>
        <div class="top-actions">
          <button class="icon-btn" type="button" data-theme-toggle aria-label="Alternar tema">◐</button>
          <button class="avatar" type="button" data-nav="settings.html" title="Configurações">AS</button>
        </div>
      </header>
      
  <section class="grid two">
    <article class="card setting-card">
      <span class="eyebrow">Perfil</span><h3>Como o Fluir chama você</h3>
      <form data-profile-form>
        <label>Nome<input name="name" data-settings-name></label>
        <button class="button primary compact" type="submit">Salvar</button>
      </form>
    </article>

    <article class="card setting-card">
      <span class="eyebrow">Aparência</span><h3>Tema</h3><p class="muted">Alterne entre claro e escuro.</p>
      <button class="button ghost compact" type="button" data-theme-toggle>Alternar tema</button>
    </article>

    <article class="card setting-card">
      <span class="eyebrow">Água</span><h3>Meta diária</h3>
      <form data-water-goal-form>
        <label>Meta em ml<input name="goal" type="number" min="500" max="5000" step="100" data-settings-water></label>
        <button class="button primary compact" type="submit">Atualizar meta</button>
      </form>
    </article>

    <article class="card setting-card danger">
      <span class="eyebrow">Dados locais</span><h3>Recomeçar demonstração</h3>
      <p class="muted">Apaga tarefas, hábitos e registros deste navegador.</p>
      <button class="button ghost compact" type="button" data-reset-app>Resetar MVP</button>
    </article>
  </section>

    </main>
  </div>
  <nav class="bottom-nav" data-bottom-nav></nav>
  <div class="toast" data-toast></div>
  <script src="../js/mvp.js"></script>
</body>
</html>
