<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Configurações · Fluir Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/mockup.css">
</head>
<body class="mockup-app" data-page="settings">
  <div class="demo-ribbon">Mockup visual · dados demonstrativos</div>
  <div class="app-layout">
    <aside class="app-sidebar" data-shell-nav></aside>
    <main class="app-main">
      <header class="page-header">
        <div>
          <span class="eyebrow">Seu Fluir, do seu jeito</span>
          <h1>Configurações</h1>
        </div>
        <div class="header-actions">
          <button class="icon-button" type="button" data-theme-toggle aria-label="Alternar tema">◐</button>
          <div class="avatar" title="Alex">AS</div>
        </div>
      </header>
      
  <section class="settings-grid">
    <article class="setting-card">
      <span class="eyebrow">Aparência</span><h3>Tema da interface</h3><p>Use claro ou escuro conforme o momento.</p>
      <button class="button ghost compact" type="button" data-theme-toggle>Alternar tema</button>
    </article>
    <article class="setting-card">
      <span class="eyebrow">Comunicação</span><h3>Tom calmo e direto</h3><p>Mensagens breves, acolhedoras e sem pressão desnecessária.</p>
      <select><option>Calmo e direto</option><option>Objetivo</option><option>Encorajador</option></select>
    </article>
    <article class="setting-card span-2">
      <span class="eyebrow">Áreas ativas</span><h3>O que aparece no seu Fluir</h3>
      <div class="toggle-list">
        <label><span>Tarefas<small>Planejamento do dia</small></span><input type="checkbox" checked></label>
        <label><span>Hábitos<small>Constância e rotina</small></span><input type="checkbox" checked></label>
        <label><span>Água<small>Hidratação diária</small></span><input type="checkbox" checked></label>
        <label><span>Diário emocional<small>Registros e percepção</small></span><input type="checkbox" checked></label>
      </div>
    </article>
  </section>

    </main>
  </div>
  <nav class="mobile-nav" data-mobile-nav aria-label="Navegação mobile"></nav>
  <script src="../js/mockup.js"></script>
</body>
</html>
