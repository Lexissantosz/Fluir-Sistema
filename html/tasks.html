<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Tarefas · Fluir Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/mockup.css">
</head>
<body class="mockup-app" data-page="tasks">
  <div class="demo-ribbon">Mockup visual · dados demonstrativos</div>
  <div class="app-layout">
    <aside class="app-sidebar" data-shell-nav></aside>
    <main class="app-main">
      <header class="page-header">
        <div>
          <span class="eyebrow">Organização prática</span>
          <h1>Tarefas</h1>
        </div>
        <div class="header-actions">
          <button class="icon-button" type="button" data-theme-toggle aria-label="Alternar tema">◐</button>
          <div class="avatar" title="Alex">AS</div>
        </div>
      </header>
      
  <section class="section-toolbar">
    <div class="filter-chips"><button class="active">Hoje</button><button>Próximas</button><button>Concluídas</button></div>
    <button class="button primary compact" type="button" data-task-add>+ Nova tarefa</button>
  </section>
  <section class="content-grid">
    <article class="panel">
      <div class="panel-heading"><div><span class="eyebrow">Hoje</span><h3>3 prioridades</h3></div><span class="muted">2 de 5 concluídas</span></div>
      <div class="list" data-task-list>
        <label class="list-row"><input type="checkbox" checked><span><strong>Revisar apresentação do PI</strong><small>Estudos · 10:30</small></span><em>Alta</em></label>
        <label class="list-row"><input type="checkbox"><span><strong>Finalizar tela do mockup</strong><small>Fluir · 14:00</small></span><em>Média</em></label>
        <label class="list-row"><input type="checkbox"><span><strong>Preparar material do curso</strong><small>Curso · 18:20</small></span><em>Normal</em></label>
        <label class="list-row"><input type="checkbox" checked><span><strong>Responder atividade de português</strong><small>Escola · concluída</small></span><em>Normal</em></label>
        <label class="list-row"><input type="checkbox"><span><strong>Separar roupa para amanhã</strong><small>Pessoal · 21:00</small></span><em>Baixa</em></label>
      </div>
    </article>
    <aside class="panel side-panel">
      <span class="eyebrow">Distribuição</span><h3>Seu dia está possível.</h3>
      <div class="ring"><strong>40%</strong><span>concluído</span></div>
      <p class="muted">Priorizar três tarefas é suficiente para manter o dia avançando sem transformar produtividade em punição.</p>
    </aside>
  </section>

    </main>
  </div>
  <nav class="mobile-nav" data-mobile-nav aria-label="Navegação mobile"></nav>
  <script src="../js/mockup.js"></script>
</body>
</html>
