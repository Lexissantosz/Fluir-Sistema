<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Tarefas · Fluir MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/mvp.css"></head>
<body data-page="tasks">
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>
    <main class="main">
      <header class="topbar">
        <div><span class="eyebrow">Planejamento prático</span><h1>Tarefas</h1></div>
        <div class="top-actions">
          <button class="icon-btn" type="button" data-theme-toggle aria-label="Alternar tema">◐</button>
          <button class="avatar" type="button" data-nav="settings.html" title="Configurações">AS</button>
        </div>
      </header>
      
  <section class="toolbar">
    <div><span class="muted" data-task-count>0 tarefas</span></div>
    <button class="button primary compact" type="button" data-open-task-form>+ Nova tarefa</button>
  </section>

  <section class="grid task-layout">
    <article class="card">
      <div class="filter-row">
        <button class="chip active" data-task-filter="all">Todas</button>
        <button class="chip" data-task-filter="pending">Pendentes</button>
        <button class="chip" data-task-filter="done">Concluídas</button>
      </div>
      <div class="task-list" data-task-list></div>
      <div class="empty-state hidden" data-task-empty>Nenhuma tarefa aqui ainda.</div>
    </article>

    <aside class="card form-card hidden-mobile" data-task-form>
      <span class="eyebrow">Adicionar</span><h3>Nova tarefa</h3>
      <form data-new-task-form>
        <label>Título<input name="title" required placeholder="Ex.: revisar apresentação"></label>
        <label>Categoria<select name="category"><option>Estudos</option><option>Projeto</option><option>Casa</option><option>Pessoal</option></select></label>
        <label>Horário<input name="time" type="time"></label>
        <button class="button primary full" type="submit">Salvar tarefa</button>
      </form>
    </aside>
  </section>

  <dialog class="mobile-dialog" data-task-dialog>
    <form method="dialog" class="dialog-card">
      <div class="card-head"><h3>Nova tarefa</h3><button class="icon-btn" value="cancel">×</button></div>
      <label>Título<input name="mobileTitle" placeholder="Ex.: revisar apresentação"></label>
      <label>Categoria<select name="mobileCategory"><option>Estudos</option><option>Projeto</option><option>Casa</option><option>Pessoal</option></select></label>
      <label>Horário<input name="mobileTime" type="time"></label>
      <button class="button primary full" type="button" data-save-mobile-task>Salvar tarefa</button>
    </form>
  </dialog>

    </main>
  </div>
  <nav class="bottom-nav" data-bottom-nav></nav>
  <div class="toast" data-toast></div>
  <script src="../js/mvp.js"></script>
</body>
</html>
