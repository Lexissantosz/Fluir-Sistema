<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Água · Fluir Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/mockup.css">
</head>
<body class="mockup-app" data-page="water">
  <div class="demo-ribbon">Mockup visual · dados demonstrativos</div>
  <div class="app-layout">
    <aside class="app-sidebar" data-shell-nav></aside>
    <main class="app-main">
      <header class="page-header">
        <div>
          <span class="eyebrow">Autocuidado simples</span>
          <h1>Água</h1>
        </div>
        <div class="header-actions">
          <button class="icon-button" type="button" data-theme-toggle aria-label="Alternar tema">◐</button>
          <div class="avatar" title="Alex">AS</div>
        </div>
      </header>
      
  <section class="water-layout">
    <article class="water-hero">
      <span class="eyebrow">Meta diária</span>
      <div class="water-progress">
        <div class="water-orb"><strong data-water-amount>1400</strong><span>ml de 2000</span></div>
      </div>
      <p>Você está a <strong data-water-left>600 ml</strong> da sua meta de hoje.</p>
      <div class="water-actions">
        <button class="button ghost" type="button" data-add-water="200">+ 200 ml</button>
        <button class="button ghost" type="button" data-add-water="300">+ 300 ml</button>
        <button class="button primary" type="button" data-add-water="500">+ 500 ml</button>
      </div>
    </article>
    <article class="panel">
      <div class="panel-heading"><div><span class="eyebrow">Hoje</span><h3>Registros</h3></div><span class="muted">5 entradas</span></div>
      <div class="timeline-preview compact-timeline" data-water-history>
        <div><time>08:10</time><span></span><p><strong>400 ml</strong><small>Ao acordar</small></p></div>
        <div><time>10:05</time><span></span><p><strong>300 ml</strong><small>Durante os estudos</small></p></div>
        <div><time>12:40</time><span></span><p><strong>400 ml</strong><small>Almoço</small></p></div>
        <div><time>14:20</time><span></span><p><strong>300 ml</strong><small>Curso</small></p></div>
      </div>
    </article>
  </section>

    </main>
  </div>
  <nav class="mobile-nav" data-mobile-nav aria-label="Navegação mobile"></nav>
  <script src="../js/mockup.js"></script>
</body>
</html>
