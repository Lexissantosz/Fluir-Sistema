<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Água · Fluir MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/mvp.css"></head>
<body data-page="water">
  <div class="app-shell">
    <aside class="sidebar" data-sidebar></aside>
    <main class="main">
      <header class="topbar">
        <div><span class="eyebrow">Autocuidado básico</span><h1>Água</h1></div>
        <div class="top-actions">
          <button class="icon-btn" type="button" data-theme-toggle aria-label="Alternar tema">◐</button>
          <button class="avatar" type="button" data-nav="settings.html" title="Configurações">AS</button>
        </div>
      </header>
      
  <section class="water-grid">
    <article class="water-card">
      <span class="eyebrow">Meta diária</span>
      <div class="water-ring" data-water-ring>
        <strong data-water-total>0</strong><span>ml</span>
      </div>
      <p><span data-water-percent>0%</span> da meta de <strong data-water-goal>2000 ml</strong></p>
      <div class="water-buttons">
        <button class="button ghost" data-water-add="200">+ 200 ml</button>
        <button class="button ghost" data-water-add="300">+ 300 ml</button>
        <button class="button primary" data-water-add="500">+ 500 ml</button>
      </div>
    </article>

    <article class="card">
      <div class="card-head"><div><span class="eyebrow">Hoje</span><h3>Histórico</h3></div><button class="button ghost compact" data-water-reset>Resetar</button></div>
      <div class="water-history" data-water-history></div>
    </article>
  </section>

    </main>
  </div>
  <nav class="bottom-nav" data-bottom-nav></nav>
  <div class="toast" data-toast></div>
  <script src="../js/mvp.js"></script>
</body>
</html>
