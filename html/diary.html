<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Diário emocional · Fluir Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/mockup.css">
</head>
<body class="mockup-app" data-page="diary">
  <div class="demo-ribbon">Mockup visual · dados demonstrativos</div>
  <div class="app-layout">
    <aside class="app-sidebar" data-shell-nav></aside>
    <main class="app-main">
      <header class="page-header">
        <div>
          <span class="eyebrow">Espaço para perceber o dia</span>
          <h1>Diário emocional</h1>
        </div>
        <div class="header-actions">
          <button class="icon-button" type="button" data-theme-toggle aria-label="Alternar tema">◐</button>
          <div class="avatar" title="Alex">AS</div>
        </div>
      </header>
      
  <section class="diary-layout">
    <article class="panel diary-editor">
      <span class="eyebrow">Como você está agora?</span>
      <div class="mood-options" data-moods>
        <button type="button">Leve</button><button class="active" type="button">Calmo</button><button type="button">Cansado</button><button type="button">Ansioso</button>
      </div>
      <label class="editor-label">O que merece ser registrado?
        <textarea rows="7">Hoje consegui avançar no projeto sem tentar resolver tudo de uma vez. Ainda tenho coisas pendentes, mas o dia está andando.</textarea>
      </label>
      <div class="editor-footer"><span class="muted">Somente um registro demonstrativo.</span><button class="button primary compact" type="button" data-save-note>Salvar registro</button></div>
    </article>
    <aside class="panel side-panel">
      <span class="eyebrow">Últimos dias</span><h3>Seu clima recente</h3>
      <div class="mood-history">
        <div><span>Hoje</span><strong>Calmo</strong></div>
        <div><span>Ontem</span><strong>Cansado</strong></div>
        <div><span>Terça</span><strong>Leve</strong></div>
        <div><span>Segunda</span><strong>Ansioso</strong></div>
      </div>
    </aside>
  </section>

    </main>
  </div>
  <nav class="mobile-nav" data-mobile-nav aria-label="Navegação mobile"></nav>
  <script src="../js/mockup.js"></script>
</body>
</html>
