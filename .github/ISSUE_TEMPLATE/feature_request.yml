name: Sugestão
description: Sugira uma melhoria para o Fluir.
title: "[sugestão] "
labels:
  - enhancement
body:
  - type: textarea
    id: idea
    attributes:
      label: Qual é a sugestão?
      description: Explique a melhoria que você gostaria de ver.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Por que isso seria útil?
      description: Conte qual problema essa ideia resolveria.
