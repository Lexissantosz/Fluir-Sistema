name: Erro do sistema
description: Reporte algo que não funciona como deveria no Fluir.
title: "[bug] "
labels:
  - bug
body:
  - type: input
    id: page
    attributes:
      label: Tela ou página
      placeholder: Ex.: Água, Perfil, Configurações
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
      description: Descreva o erro de forma objetiva.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: O que deveria acontecer?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra...
        2. Clique...
        3. Observe...
