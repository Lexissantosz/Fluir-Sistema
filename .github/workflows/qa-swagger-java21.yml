name: QA Fluir - Swagger OpenAPI (Java 21)
on:
  push:
    branches:
      - alex/entrega-documentacao-qa-30-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentar-e-verificar-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fluir
          POSTGRES_PASSWORD: somente-teste-ci
          POSTGRES_DB: fluir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluir -d fluir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: fluir
      DB_USER: fluir
      DB_PASSWORD: somente-teste-ci
    steps:
      - name: Obter codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Iniciar backend local em perfil QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p testes/execucao/swagger
          nohup bash -c 'cd backend && exec bash ./mvnw -B spring-boot:run -Dspring-boot.run.profiles=qa' \
            > testes/execucao/swagger/backend-qa.log 2>&1 < /dev/null &
          APP_PID=$!
          echo "Backend PID: $APP_PID"
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 "http://127.0.0.1:8080/api/usuarios/teste" > testes/execucao/swagger/health.txt; then
              echo "Backend QA disponivel."
              break
            fi
            sleep 2
          done
          if ! curl --fail --show-error --silent --max-time 15 "http://127.0.0.1:8080/api/usuarios/teste" -o testes/execucao/swagger/health.txt; then
            echo "Backend não iniciou. Últimas linhas do log:"
            tail -n 100 testes/execucao/swagger/backend-qa.log || true
            exit 1
          fi

      - name: Exportar OpenAPI e validar Swagger UI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 30 \
            "http://127.0.0.1:8080/v3/api-docs" \
            -o testes/execucao/swagger/openapi.json
          curl --fail --show-error --silent --location --max-time 30 \
            "http://127.0.0.1:8080/swagger-ui.html" \
            -o testes/execucao/swagger/swagger-ui.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path("testes/execucao/swagger")
          data = json.loads((base / "openapi.json").read_text(encoding="utf-8"))
          assert str(data.get("openapi", "")).startswith("3."), "OpenAPI 3 nao encontrado"
          paths = data.get("paths", {})
          assert "/api/usuarios/teste" in paths, "Rota de teste nao esta no Swagger"
          assert "get" in paths["/api/usuarios/teste"], "Metodo GET nao documentado"
          assert "/api/usuarios/login" in paths, "Rota de login nao documentada"
          assert "post" in paths["/api/usuarios/login"], "Metodo POST de login nao documentado"
          html = (base / "swagger-ui.html").read_text(encoding="utf-8").lower()
          assert "swagger" in html, "Pagina do Swagger UI nao foi carregada"
          ops = sum(len([method for method in item if method in ("get","post","put","patch","delete","head","options")]) for item in paths.values())
          report = [
              "# Evidencia automatizada - Swagger / OpenAPI",
              "",
              "- Status: aprovado na validacao tecnica automatizada do runner (quando workflow verde)",
              f"- Especificacao: {data['openapi']}",
              f"- Rotas documentadas: {len(paths)}",
              f"- Operacoes documentadas: {ops}",
              "- GET /api/usuarios/teste: presente",
              "- POST /api/usuarios/login: presente",
              "- Swagger UI: HTML acessivel no backend de teste",
              "- Ambiente: GitHub Actions, Java 21, PostgreSQL 16, perfil qa",
              "- Limite: nao substitui teste manual da interface Swagger UI e requests de negocio",
              "",
              "## Rotas exportadas",
              "",
              *[f"- `{p}`: {', '.join(k.upper() for k in v if k.lower() in ('get','post','put','patch','delete'))}" for p,v in sorted(paths.items())]
          ]
          (base / "relatorio-swagger.md").write_text("\n".join(report) + "\n", encoding="utf-8")
          print(f"Swagger validado: {len(paths)} rotas, {ops} operacoes")
          PY

      - name: Capturar Swagger UI via Chrome se estiver disponivel
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$BROWSER" ]; then
            "$BROWSER" --headless --no-sandbox --disable-gpu --hide-scrollbars \
              --virtual-time-budget=6000 --window-size=1440,1100 \
              --screenshot="$GITHUB_WORKSPACE/testes/execucao/swagger/swagger-ui.png" \
              "http://127.0.0.1:8080/swagger-ui/index.html" > /dev/null 2>&1 \
              || echo "Captura do Chrome indisponivel; verificacoes HTTP continuam validas."
          else
            echo "Chrome nao encontrado no runner, sem captura grafica."
          fi

      - name: Guardar evidencias reais Swagger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fluir-evidencias-swagger
          path: |
            testes/execucao/swagger/openapi.json
            testes/execucao/swagger/swagger-ui.html
            testes/execucao/swagger/swagger-ui.png
            testes/execucao/swagger/health.txt
            testes/execucao/swagger/relatorio-swagger.md
            testes/execucao/swagger/backend-qa.log
          if-no-files-found: warn
          retention-days: 14
