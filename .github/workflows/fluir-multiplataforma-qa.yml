name: "Fluir | QA multiplataforma e APK de avaliacao"

on:
  push:
    branches:
      - alex/pwa-dispositivos-dossie-23-11
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluir-plataformas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-mobile:
    name: PWA, web estatico e prototipo React
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Instalar Capacitor e validar manifesto
        run: |
          npm ci --no-audit --no-fund
          npm run check:pwa
          npm run prepare:web
          npm run check:web
      - name: Validar build e lint do prototipo React
        run: |
          npm ci --prefix mobile --no-audit --no-fund
          npm run lint --prefix mobile
          npm run build --prefix mobile

  backend:
    name: Testes backend Java 21 + PostgreSQL isolado
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fluir_qa
          POSTGRES_USER: fluirqa
          POSTGRES_PASSWORD: fluir-qa-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluirqa -d fluir_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fluir_qa
      SPRING_DATASOURCE_USERNAME: fluirqa
      SPRING_DATASOURCE_PASSWORD: fluir-qa-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: JUnit, Mockito, Spring Security e regras de dominio
        run: mvn -B -f backend/pom.xml test

  android:
    name: Compilar APK Android de debug (nao e release)
    runs-on: ubuntu-latest
    needs: [web-mobile]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validar e preparar assets web
        run: |
          npm ci --no-audit --no-fund
          npm run prepare:web
          npm run check:web
      - name: Criar projeto Android e sincronizar
        run: |
          npx cap add android
          npx capacitor-assets generate --android --assetPath resources --iconBackgroundColor "#FAF8FD" --iconBackgroundColorDark "#171717" --splashBackgroundColor "#FAF8FD" --splashBackgroundColorDark "#171717"
          npx cap sync android
      - name: Compilar APK de avaliacao
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Publicar artefato debug temporario
        uses: actions/upload-artifact@v4
        with:
          name: Fluir-Android-QA-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
