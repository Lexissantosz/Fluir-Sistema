name: QA Fluir - JMeter (API local)
on:
  push:
    branches: [alex/entrega-documentacao-qa-30-10]
    paths:
      - "testes/jmeter/**"
      - ".github/workflows/qa-jmeter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  carga-local-controlada:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fluir
          POSTGRES_PASSWORD: somente-teste-ci
          POSTGRES_DB: fluir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluir -d fluir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: fluir
      DB_USER: fluir
      DB_PASSWORD: somente-teste-ci
    steps:
      - name: Obter codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Iniciar backend com banco isolado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p testes/execucao/jmeter
          nohup bash -c 'cd backend && exec bash ./mvnw -B spring-boot:run -Dspring-boot.run.profiles=qa' > testes/execucao/jmeter/backend-qa.log 2>&1 < /dev/null &
          for i in $(seq 1 75); do
            if curl -fsS --max-time 3 "http://127.0.0.1:8080/api/usuarios/teste" > /dev/null 2>&1; then echo "API local disponivel"; exit 0; fi
            sleep 2
          done
          tail -n 100 testes/execucao/jmeter/backend-qa.log
          exit 1
      - name: Baixar JMeter 5.6.3 e verificar SHA512 da ASF
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz" -o /tmp/apache-jmeter-5.6.3.tgz
          curl -fsSL --retry 3 "https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz.sha512" -o /tmp/apache-jmeter-5.6.3.tgz.sha512
          expected=$(grep -oE '[[:xdigit:]]{128}' /tmp/apache-jmeter-5.6.3.tgz.sha512 | head -n 1 | tr 'A-F' 'a-f')
          actual=$(sha512sum /tmp/apache-jmeter-5.6.3.tgz | cut -d' ' -f1)
          test -n "$expected" && test "$expected" = "$actual"
          tar -xzf /tmp/apache-jmeter-5.6.3.tgz -C /tmp
      - name: Executar 2 usuarios x 2 iteracoes somente localhost
        shell: bash
        run: |
          set -euo pipefail
          /tmp/apache-jmeter-5.6.3/bin/jmeter -n -t testes/jmeter/fluir-api-local.jmx -l testes/execucao/jmeter/resultados.jtl -e -o testes/execucao/jmeter/relatorio-html
          python3 - <<'PY'
          import csv, json, statistics
          from pathlib import Path
          folder=Path('testes/execucao/jmeter')
          with (folder/'resultados.jtl').open(encoding='utf-8-sig',newline='') as file:
              rows=list(csv.DictReader(file))
          assert len(rows)==4, f"Quantidade inesperada de amostras: {len(rows)}"
          fails=[r for r in rows if r.get('success','').lower()!='true' or r.get('responseCode')!='200']
          durations=[int(r['elapsed']) for r in rows]
          output={'amostras':len(rows),'sucessos':len(rows)-len(fails),'falhas':len(fails),'min_ms':min(durations),'max_ms':max(durations),'media_ms':round(statistics.mean(durations),2),'ambiente':'localhost:8080; PostgreSQL isolado; 2 usuarios, 2 loops'}
          (folder/'resumo.json').write_text(json.dumps(output,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps(output,ensure_ascii=False))
          assert not fails, f"Falhas detectadas no JMeter: {fails}"
          PY
      - name: Guardar logs, JTL, resumo e relatorio HTML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fluir-evidencias-jmeter
          path: |
            testes/execucao/jmeter/resultados.jtl
            testes/execucao/jmeter/resumo.json
            testes/execucao/jmeter/relatorio-html/**
            testes/execucao/jmeter/backend-qa.log
          if-no-files-found: warn
          retention-days: 14
