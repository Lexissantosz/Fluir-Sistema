name: Fluir | Android APK e verificacao PWA

on:
  push:
    branches:
      - main
      - alex/android-apk-fluir
      - alex/automacao-android-iphone-19-11
      - alex/google-login-onboarding-19-11
      - alex/assistente-ia-fluir-19-11
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluir-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Compilar APK Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar Android SDK do runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          test -d "$ANDROID_HOME/build-tools"
      - name: Instalar dependencias Capacitor
        run: npm install --no-audit --no-fund
      - name: Preparar paginas e validar PWA
        run: |
          npm run prepare:web
          npm run check:web
          npm run check:auth
          npm run check:assistant
      - name: Criar projeto Android nativo
        run: npx cap add android
      - name: Gerar icones e splash Android com a marca Fluir
        run: npx capacitor-assets generate --android --assetPath resources --iconBackgroundColor "#E7F4ED" --iconBackgroundColorDark "#172B24" --splashBackgroundColor "#E7F4ED" --splashBackgroundColorDark "#172B24"
      - name: Gerar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Arquivar APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: Fluir-Android-APK-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  backend-compile:
    name: Validar backend Spring Boot (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compilar backend sem conectar ao banco
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode -DskipTests package
