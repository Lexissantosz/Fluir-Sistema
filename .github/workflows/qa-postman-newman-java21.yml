name: QA Fluir - Postman Newman (Java 21)
on:
  push:
    branches: [alex/entrega-documentacao-qa-30-10]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-api-postman:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fluir
          POSTGRES_PASSWORD: somente-teste-ci
          POSTGRES_DB: fluir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluir -d fluir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: fluir
      DB_USER: fluir
      DB_PASSWORD: somente-teste-ci
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Subir API em ambiente isolado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p testes/execucao/postman
          nohup bash -c 'cd backend && exec bash ./mvnw -B spring-boot:run -Dspring-boot.run.profiles=qa' \
            > testes/execucao/postman/backend-qa.log 2>&1 < /dev/null &
          APP_PID=$!
          echo "Backend PID: $APP_PID"
          for i in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/api/usuarios/teste > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "API local indisponivel. Log do backend:"
          tail -n 100 testes/execucao/postman/backend-qa.log || true
          exit 1
      - name: Instalar Newman
        run: npm install --global newman@6.2.1
      - name: Executar coleção Postman
        shell: bash
        run: |
          set -euo pipefail
          newman run testes/postman/Fluir-QA.postman_collection.json \
            --reporters cli,json \
            --reporter-json-export testes/execucao/postman/newman-resultados.json \
            --suppress-exit-code > testes/execucao/postman/newman-console.txt 2>&1
          node - <<'NODE'
          const fs = require('node:fs');
          const j = JSON.parse(fs.readFileSync('testes/execucao/postman/newman-resultados.json','utf8'));
          const r=j.run?.stats||{};
          const total=r.assertions?.total||0, failed=r.assertions?.failed||0;
          const requests=r.requests?.total||0, reqFail=r.requests?.failed||0;
          const report = [
            '# Evidência Newman/Postman — Fluir',
            '',
            'Ambiente: GitHub Actions, Java 21, PostgreSQL isolado, localhost.',
            'Requisições: '+requests,
            'Asserções: '+total,
            'Falhas de asserção: '+failed,
            'Falhas de requisição: '+reqFail,
            '',
            'Status: '+(failed===0&&reqFail===0&&total>=11?'APROVADO':'FALHOU')
          ].join('\n')+'\n';
          fs.writeFileSync('testes/execucao/postman/resumo.md',report);
          // O JSON bruto contém corpos de resposta e possivelmente tokens; não publicar como artefato.
          if(failed||reqFail||total<11){process.exitCode=1}
          NODE
      - name: Guardar resumo e saída sem dados de sessão
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fluir-evidencias-postman
          path: testes/execucao/postman/resumo.md
          if-no-files-found: warn
          retention-days: 14
