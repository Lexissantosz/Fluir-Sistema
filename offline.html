<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Fluir | Sem conexão</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#181818;background:#faf8fd}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{background:white;border:1px solid #dedee1;border-radius:22px;padding:30px;max-width:480px;box-shadow:0 10px 40px #0001}
    img{width:64px;height:64px}
    h1{font-size:24px;margin:16px 0 10px}
    p{line-height:1.6;color:#555}
    button{background:#171717;color:white;border:0;border-radius:12px;padding:13px 20px;font-weight:700;font-size:15px;cursor:pointer}
    button:focus-visible{outline:3px solid #777;outline-offset:3px}
  </style>
</head>
<body>
  <main role="main">
    <img src="/Assets/brand/fluir-symbol.svg" alt="">
    <h1>Você está sem conexão.</h1>
    <p>O Fluir precisa de internet para fazer login e sincronizar tarefas, ciclos e outras informações pessoais. Nenhuma alteração foi salva agora.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
